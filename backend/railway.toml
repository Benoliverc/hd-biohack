# Railway service config — set Root Directory to `backend` in the dashboard
# (or deploy from this folder). Dockerfile path is relative to that root.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
